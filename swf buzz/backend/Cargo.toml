[package]
name = "swf-buzz-backend"
version = "0.1.0"
description = "SWF Buzz backend — Okta-verified session issuance and (later) community/channel HTTP API. See docs/BACKEND_SESSION_DESIGN.md and DECISIONS.md D10."
edition = "2021"
license = "Apache-2.0"

[lib]
name = "swf_buzz_backend"
path = "src/lib.rs"

[[bin]]
name = "swf-buzz-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "test-util", "time"] }
tokio-tungstenite = "0.24"

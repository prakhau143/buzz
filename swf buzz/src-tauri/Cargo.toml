[package]
name = "swf-buzz"
version = "0.1.0"
description = "SWF Buzz — secure employee desktop client for the Buzz backend"
authors = ["SWF"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swf_buzz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
jsonwebtoken = "9"
# Local Nostr identity (src/identity/): key generation, BIP-340 event signing,
# NIP-49 (`nip49`) password-encrypted key backup, and NIP-44 (`nip44`) payload
# encryption. NIP-44 is required by NIP-RS read state (kind:30078), whose content
# is encrypted to the author's own keypair. Same crate/version as the reference
# Buzz desktop.
nostr = { version = "0.44", features = ["nip49", "nip44"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
buzz-core = { version = "0.1.0", path = "../../buzz/crates/buzz-core" }
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
zeroize = "1.9.0"

# Native Windows toasts with a click (activation) callback — the same library
# tauri-plugin-notification uses internally, which exposes no click handler.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# Reads the real OS notification setting (ToastNotifier.Setting); same
# version/features tauri-winrt-notification already builds.
windows = { version = "0.62", features = ["UI_Notifications"] }

# scrypt (NIP-49 key backup, cost 2^18) is unusably slow unoptimised. Build only
# the key-derivation crates optimised in dev/test profiles; everything else keeps
# fast debug builds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
